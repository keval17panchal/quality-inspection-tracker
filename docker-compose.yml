version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: qc-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: qc_inspection_db
      MYSQL_USER: qcuser
      MYSQL_PASSWORD: qcpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: qc-redis
    restart: always
    ports:
      - "6379:6379"

  config-server:
    build: ./config-server
    container_name: qc-config-server
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  eureka-server:
    build: ./eureka-server
    container_name: qc-eureka-server
    ports:
      - "8761:8761"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    container_name: qc-api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      - eureka-server
      - redis

  inspection-service-1:
    build: ./inspection-service
    container_name: qc-inspection-service-1
    ports:
      - "8081:8081"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/qc_inspection_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=qcuser
      - SPRING_DATASOURCE_PASSWORD=qcpassword
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

  inspection-service-2:
    build: ./inspection-service
    container_name: qc-inspection-service-2
    ports:
      - "8082:8081"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/qc_inspection_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=qcuser
      - SPRING_DATASOURCE_PASSWORD=qcpassword
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: qc-frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway

volumes:
  mysql_data:

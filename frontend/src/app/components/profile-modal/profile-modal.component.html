<div class="modal-backdrop" (click)="onBackdropClick($event)">
  <div class="modal-card">
    <div class="modal-header">
      <div class="header-left">
        <span class="modal-icon">👤</span>
        <div>
          <h3>Edit Profile</h3>
          <p class="subtitle">Update your display name and password</p>
        </div>
      </div>
      <button class="close-btn" (click)="close.emit()" title="Close">&times;</button>
    </div>

    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="modal-body">
      <div *ngIf="successMessage" class="alert-success">
        ✅ {{ successMessage }}
      </div>

      <div *ngIf="errorMessage" class="alert-error">
        ⚠️ {{ errorMessage }}
      </div>

      <div class="form-group">
        <label>Username (Fixed)</label>
        <input
          type="text"
          [value]="user.username"
          class="form-control disabled-input"
          disabled
        />
      </div>

      <div class="form-group">
        <label>Role</label>
        <div class="role-display">
          <span class="role-badge" [class.admin-badge]="user.role === 'ADMIN'">
            {{ user.role }}
          </span>
        </div>
      </div>

      <div class="form-group">
        <label for="name">Full Name <span class="required">*</span></label>
        <input
          type="text"
          id="name"
          formControlName="name"
          class="form-control"
          placeholder="Enter full name"
        />
        <div *ngIf="profileForm.get('name')?.touched && profileForm.get('name')?.invalid" class="field-error">
          Full Name is required.
        </div>
      </div>

      <div class="form-group">
        <label for="password">New Password (optional)</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="form-control"
          placeholder="Leave blank to keep current password"
        />
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" (click)="close.emit()" [disabled]="submitting">
          Cancel
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="submitting">
          <span *ngIf="submitting" class="spinner"></span>
          {{ submitting ? 'Saving...' : '💾 Save Changes' }}
        </button>
      </div>
    </form>
  </div>
</div>
